[project]
name = "sourcer"
version = "0.1.0"
description = "Ranks small businesses as acquisition targets, with the reasoning shown."
readme = "README.md"
authors = [
    { name = "Abubakar Khawaja", email = "abubakark1998@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
sourcer = "sourcer.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.14.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Errors, undefined names, import order, likely bugs, modern syntax.
# Annotation rules (ANN) are deliberately absent: this project uses no type hints.
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
